[package]
name = "site"
description = "REDSTONEPEDIA (docs/site.md): `mctas site build` exports every build (3x3 piston doors, clocks, circuits) with its properties to JSON, one HTML page per build and per extendable family, and the filtering UI (web/site, Rust compiled to WebAssembly); `mctas site deploy` publishes it on the gh-pages branch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
mctas = { path = "../mctas" }
piston-door = { path = "../piston-door" }
clock = { path = "../clock" }
circuit = { path = "../circuit" }
site-model = { path = "../site-model" }
litematic = { path = "../litematic" }
# the viewer's own session (webrender): whether the 3D view can run a design or shows it as built,
# and a shulker machine run the way the view runs it (the boxes it sends out)
mcview = { path = "../mcview" }
redsim = { path = "../redsim" }
# the simulation cache's keys (src/cache.rs)
sha2.workspace = true
# malloc_trim between the build's passes (src/generate.rs: glibc keeps every thread's arena at its
# high-water mark; the members' pass leaves tens of GB the circuits' pass would stack on top of)
libc = "0.2"

[build-dependencies]
# build.rs hashes the code each cache domain runs
sha2.workspace = true
