[package]
name = "redstonepedia"
description = "REDSTONEPEDIA's filtering UI (docs/site.md): Rust compiled to WebAssembly (wasm32-unknown-unknown + wasm-bindgen --target web); `mctas site build` builds it into site/pkg/. The query engine and the card markup are in crates/site-model, unit-tested natively."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# its own workspace: the main workspace never builds the browser crate
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
site-model = { path = "../../crates/site-model" }
serde_json = "1"
# the wasm-bindgen CLI must be this exact version (`mctas site build` checks it)
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "Event",
  "EventTarget",
  "Location",
  "History",
  "Response",
  "Node",
  "DomTokenList",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "DomParser",
  "SupportedType",
  "NodeList",
  "MouseEvent",
  "HtmlAnchorElement",
  "console",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
